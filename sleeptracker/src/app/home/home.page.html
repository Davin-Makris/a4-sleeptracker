<ion-header [translucent]="true">
  <ion-toolbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Hello [user]</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <strong>Ready to create an app?</strong>
    <p>Start with Ionic <a target="_blank" rel="noopener noreferrer" href="https://ionicframework.com/docs/components">UI Components</a></p>
  </div>
</ion-content>

<ion-footer [translucent]="true" id="footer">
<ion-toolbar>
  <ion-row class="ion-justify-content-evenly" display="flex">
    <!-- Stats button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="stats-chart"></ion-icon>
      </ion-button>
    </ion-col>

    <!-- Moon button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="moon"></ion-icon>
      </ion-button>
    </ion-col>

    <!-- Home button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="home"></ion-icon>
      </ion-button>
    </ion-col>

    <!-- Sun button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="sunny"></ion-icon>
      </ion-button>
    </ion-col>

    <!-- Profile button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="person"></ion-icon>
      </ion-button>
    </ion-col>

  </ion-row>

</ion-toolbar>
</ion-footer>
