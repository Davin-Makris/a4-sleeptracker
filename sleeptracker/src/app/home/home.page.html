<ion-content [fullscreen]="true">
  <h1 size="large" class="main_title">Hello [user]</h1>

  <!-- Card to overnight log-->
  <ion-card class="log_card" id="overnight_card" routerLink = "/tabs/overnight">
    <ion-card-header>
      <ion-card-title>Overnight Log</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Log last night's sleep
    </ion-card-content>
  </ion-card>

  <!-- Card to daily tiredness-->
  <ion-card class="log_card" id="daily_card" routerLink = "/tabs/day">
    <ion-card-header>
      <ion-card-title>Daily Tiredness</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Log today's tiredness
    </ion-card-content>
  </ion-card>
</ion-content>
