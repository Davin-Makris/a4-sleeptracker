<ion-content [fullscreen]="true">
  <h1 size="large" class="main_title">Hello [user]</h1>

  <!-- Card to overnight log-->
  <ion-card class="log_card" id="overnight_card">
    <ion-card-header>
      <ion-card-title>Overnight Log</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Log last night's sleep
    </ion-card-content>
  </ion-card>

  <!-- Card to daily tiredness-->
  <ion-card class="log_card" id="daily_card">
    <ion-card-header>
      <ion-card-title>Daily Tiredness</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Log today's tiredness
    </ion-card-content>
  </ion-card>
</ion-content>

<ion-footer [translucent]="true" id="footer">
<ion-toolbar>
  <ion-row class="ion-justify-content-evenly">
    <!-- Stats button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="stats-chart"></ion-icon>
      </ion-button>
    </ion-col>

    <!-- Moon button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="moon"></ion-icon>
      </ion-button>
    </ion-col>

    <!-- Home button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="home"></ion-icon>
      </ion-button>
    </ion-col>

    <!-- Sun button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="sunny"></ion-icon>
      </ion-button>
    </ion-col>

    <!-- Profile button-->
    <ion-col class="ion-text-center">
      <ion-button class="footer_button" fill="clear">
        <ion-icon slot="icon-only" name="person"></ion-icon>
      </ion-button>
    </ion-col>

  </ion-row>

</ion-toolbar>
</ion-footer>
