<ion-content [fullscreen]="true">
  <h1 size="large" class="main_title">Good day!</h1>

  <!-- Card for the slider-->
  <ion-card class="day_card" id="slider_card">
    <ion-card-header>
      <ion-card-title>How tired do you feel?</ion-card-title>
    </ion-card-header>

    <ion-range class="range_slider"
      min="1"
      max="7"
      step="1"
      snaps="true"
      value="0"
      [(ngModel)] = "sleepinessScore">
        <ion-icon slot="start" name="happy"></ion-icon>
        <ion-icon slot="end" name="sad"></ion-icon>
    </ion-range>

    
  </ion-card>

  <!-- Card for current time-->
  <ion-card class="day_card" id="curr_time_card">
    <ion-card-header>
      <ion-card-title>What time is it?</ion-card-title>
    </ion-card-header>

    <ion-datetime presentation="time" class="time_picker" id="curr_time_picker" [(ngModel)]="timeOfDay"></ion-datetime>

    <!-- 
    <ion-card-content>Log last night's sleep</ion-card-content>
    -->
  </ion-card>

  <!-- Submit button-->
   <!-- when this button is clicked, a modal should pop up with either success or error
    The info is also sent to backend to be saved in the user's log data-->
   <ion-button class="submit_button" id="day_submit_button" shape="round" (click)="submitLog()">Submit Log</ion-button>
   <ion-toast class="submit_toast" trigger="day_submit_button" position="top" message="Submitted!" 
              [buttons]="toastButtons" duration="5000"></ion-toast>
</ion-content>
