<ion-content [fullscreen]="true">
  <h1 size="large" class="main_title">Sweet dreams</h1>

  <!-- Card for going to sleep-->
  <ion-card class="overnight_card" id="bed_card">
    <ion-card-header>
      <ion-card-title>When did you sleep?</ion-card-title>
    </ion-card-header>
    <ion-datetime presentation="time" class="time_picker" id="bed_time_picker"></ion-datetime>

    <!-- 
    <ion-card-content>Log last night's sleep</ion-card-content>
    -->
    
  </ion-card>

  <!-- Card for waking up-->
  <ion-card class="overnight_card" id="wakeup_card">
    <ion-card-header>
      <ion-card-title>When did you wake up?</ion-card-title>
    </ion-card-header>

    <ion-datetime presentation="time" class="time_picker" id="wakeup_time_picker"></ion-datetime>

    <!-- 
    <ion-card-content>Log last night's sleep</ion-card-content>
    -->
  </ion-card>

  <!-- Submit button-->
   <ion-button class="submit_button" id="overnight_submit_button">Submit Log</ion-button>
</ion-content>
