<ion-content [fullscreen]="true">
  <h1 size="large" class="main_title">Hello [user]</h1>

  <!-- Card for profile icon & buttons-->
  <ion-card class="profile_card" id="pfp_card">
  
    <ion-card-content>
      <ion-icon id="chosen_pfp_icon" name="person" size="large"></ion-icon><br />

      <ion-radio-group id="pfp_icons_picker">
        <ion-radio value="person">
          Person<br />
          <ion-icon id="pfp_person_icon" name="person" size="medium"></ion-icon>
        </ion-radio>

        <ion-radio value="moon"> 
          Moon<br />
          <ion-icon id="pfp_moon_icon" name="moon" size="medium"></ion-icon>
        </ion-radio>
      </ion-radio-group>
      
    </ion-card-content>

    <ion-card-content>
      Choose your profile icon
    </ion-card-content>
  </ion-card>

  <!-- Card for name & morning/night person buttons-->
  <ion-card class="profile_card" id="name_card">
     <ion-item class="input_wrapper">
      <ion-input label="Name: " placeholder="Enter your name" class="name_input" id="name_input"></ion-input>
    </ion-item>

    <ion-card-content>
      <div id="name_instr">I am a: <br /></div>

      <ion-radio-group value="morning_person">
        <ion-radio value="morning_person">Morning Person</ion-radio><br />
        <ion-radio value="night_owl">Night Owl</ion-radio>
      </ion-radio-group>
    </ion-card-content>
  </ion-card>

    <!-- Save button-->
   <!-- when this button is clicked, a modal should pop up with either success or error
    The info is also sent to backend to be saved in the user's log data-->
   <ion-button class="save_button" id="profile_save_button" shape="round">Save</ion-button>

</ion-content>
