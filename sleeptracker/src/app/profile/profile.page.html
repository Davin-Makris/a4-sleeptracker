<ion-content [fullscreen]="true">
  <h1 size="large" class="main_title" id="pfp_main_title">Hello {{userName}}</h1>

  <!-- Card for profile icon & buttons-->
  <ion-card class="profile_card ion-text-center" id="pfp_card">
  
    <ion-card-content id="pfp_card_content">
      <!-- the icon chosen as the pfp-->
      <ion-icon id="chosen_pfp_icon" [name]="pfpIconName" size="large"></ion-icon><br />

      <!-- button pfp options-->
      <ion-button id="pfp_person_button" fill="clear" (click)="changePfpToPerson()">
        <ion-icon id="pfp_person_icon" name="person" size="medium"></ion-icon>
      </ion-button>

      <ion-button if="pfp_moon_button" fill="clear" (click)="changePfpToMoon()">
        <ion-icon id="pfp_moon_icon" name="moon" size="medium"></ion-icon>
      </ion-button>

      <ion-button if="pfp_sun_button" fill="clear" (click)="changePfpToSun()">
        <ion-icon id="pfp_sun_icon" name="sunny" size="medium"></ion-icon>
      </ion-button>
      
      <ion-button if="pfp_heart_button" fill="clear" (click)="changePfpToHeart()">
        <ion-icon id="pfp_heart_icon" name="heart" size="medium"></ion-icon>
      </ion-button>

      <ion-button if="pfp_happy_button" fill="clear" (click)="changePfpToHappy()">
        <ion-icon id="pfp_happy_icon" name="happy" size="medium"></ion-icon>
      </ion-button>

      <!-- <br />Choose your profile icon -->
      
    </ion-card-content>
  </ion-card>

  <!-- Card for name & morning/night person buttons-->
  <ion-card class="profile_card" id="name_card">
    <ion-item class="input_wrapper">
      <ion-input #name_input label="Name: " placeholder="Enter your name" id="name_input"></ion-input>
    </ion-item>

    <ion-card-content>
      <div id="name_instr">I am a: <br /></div>

      <ion-radio-group value="morning_person">
        <ion-radio value="morning_person">Morning Person</ion-radio><br />
        <ion-radio value="night_owl">Night Owl</ion-radio>
      </ion-radio-group>
    </ion-card-content>
  </ion-card>

    <!-- Save button-->
   <!-- when this button is clicked, a modal should pop up with either success or error
    The info is also sent to backend to be saved in the user's log data-->
   <ion-button class="save_button" id="profile_save_button" shape="round" (click)="saveButton(name_input.value)">Save</ion-button>

</ion-content>
