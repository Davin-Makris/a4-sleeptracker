<ion-tabs>
  <ion-tab-bar slot="bottom" [translucent]="true" id="footer">
    
    <!-- Stats button -->
    <ion-tab-button class="footer_button" tab="stats" href="/tabs/stats" id="stats_button">
      <ion-icon class="footer_icon" name="stats-chart"></ion-icon>
    </ion-tab-button>

    <!-- Moon button -->
    <ion-tab-button class="footer_button" tab="overnight" href="/tabs/overnight" id="overnight_button">
      <ion-icon class="footer_icon" name="moon"></ion-icon>
    </ion-tab-button>

    <!-- Home button -->
    <ion-tab-button class="footer_button" tab="home" href="/tabs/home" id="home_button">
      <ion-icon class="footer_icon" name="home"></ion-icon>
    </ion-tab-button>

    <!-- Sun button -->
    <ion-tab-button class="footer_button" tab="day" href="/tabs/day" id="day_button">
      <ion-icon class="footer_icon" name="sunny"></ion-icon>
    </ion-tab-button>

    <!-- Profile button -->
    <ion-tab-button class="footer_button" tab="profile" href="/tabs/profile" id="profile_button">
      <ion-icon class="footer_icon" name="person"></ion-icon>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
