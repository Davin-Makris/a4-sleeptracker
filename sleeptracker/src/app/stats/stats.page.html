<ion-content [fullscreen]="true">
  <h1 size="large" class="main_title">Your Data</h1>

  <!-- Some example cards if you want to use these
   Feel free to delete or change them-->
  <ion-card class="stats_card" id="top_card">
    <ion-card-header>
      <ion-card-title>Card here</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Example
    </ion-card-content>
  </ion-card>

  <ion-card class="stats_card" id="bottom_card">
    <ion-card-header>
      <ion-card-title>Another Card</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Example
    </ion-card-content>
  </ion-card>

  <ion-button
    shape="round"
    (click)="clearData()">
    Clear All Data
  </ion-button>

  @for (record of allRecords; track $index) {
  <p>{{ record | json }}</p>
  } @empty {
  <p>No sleep records have been saved.</p>
  }

</ion-content>
