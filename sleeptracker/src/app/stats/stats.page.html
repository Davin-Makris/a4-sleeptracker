<ion-content [fullscreen]="true">
  <h1 size="large" class="main_title">Your Data</h1>

  <ion-card class="stats_card" id="top_card">
    <ion-card-header>
      <ion-card-title>Your Daily Data</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Chart here
    </ion-card-content>
  </ion-card>

  <ion-card class="stats_card" id="bottom_card">
    <ion-card-header>
      <ion-card-title>Your Sleep Data</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <canvas id="sleep-line-chart"> </canvas>
    </ion-card-content>
  </ion-card>

  <ion-button
    class="submit_button"
    shape="round"
    (click)="clearData()">
    Clear All Data
  </ion-button>

  <!--
  @for (record of sleepRecords; track $index) {
  <p>{{ record | json }}</p>
  } @empty {
  <p>No sleep records have been saved.</p>
  }
  -->

</ion-content>
